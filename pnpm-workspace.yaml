packages:
  - "apps/*"
  - "services/*"
  - "packages/*"

# Allow/deny dependency install/build scripts. esbuild needs its native binary (tsup/vitest);
# electron downloads its runtime binary; prisma downloads its query engine; @nestjs/core's
# script is just a console message; sharp is unused (Next images are unoptimized);
# msgpackr-extract is an optional native accel for bullmq's serializer — the pure-JS fallback
# is fine and avoids needing a native toolchain in CI.
allowBuilds:
  "@nestjs/core": false
  "@prisma/client": true
  "@prisma/engines": true
  # cpu-features/ssh2 are dockerode's optional SSH transport (we use the local socket/pipe, not
  # SSH); protobufjs's postinstall is unneeded. All pure-JS fallbacks are fine.
  cpu-features: false
  electron: true
  esbuild: true
  msgpackr-extract: false
  prisma: true
  protobufjs: false
  sharp: false
  ssh2: false
